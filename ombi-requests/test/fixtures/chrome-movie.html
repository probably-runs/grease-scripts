<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ombi Request Chrome integration fixture</title>
    <style>
        body { margin:0; min-height:100vh; background:#101820; color:#f5f5f5; font:16px/1.5 system-ui,sans-serif; }
        main { max-width:900px; margin:70px auto; padding:30px; }
        .film { display:flex; gap:30px; align-items:flex-start; }
        .poster { width:230px; aspect-ratio:2/3; border-radius:12px; background:linear-gradient(145deg,#334155,#111827); box-shadow:0 18px 50px #0008; }
        h1 { margin:20px 0 4px; font-size:44px; }
        a { color:#93c5fd; }
    </style>
    <script>
        window.__OMBI_REQUEST_TEST_INPUT__ = {
            hostname: "letterboxd.com",
            pathname: "/film/fight-club/",
            pageUrl: "https://letterboxd.com/film/fight-club/",
            heading: "Fight Club",
            yearText: "1999",
            tmdbDataId: "550",
            externalUrls: [
                "https://www.imdb.com/title/tt0137523/",
                "https://www.themoviedb.org/movie/550/"
            ],
            jsonLd: []
        };
        window.__OMBI_REQUEST_LOG__ = [];
        window.__OMBI_CONFIRM_COUNT__ = 0;
        window.confirm = () => {
            window.__OMBI_CONFIRM_COUNT__ += 1;
            document.documentElement.dataset.ombiConfirmCount = String(window.__OMBI_CONFIRM_COUNT__);
            return false;
        };

        const configured = new URLSearchParams(location.search).get("configured") !== "0";
        const savedConfig = configured ? {
            baseUrl: "https://mock-ombi.test/ombi",
            apiKey: "mock-api-key",
            userName: "test-user",
            qualityProfileOverrides: {}
        } : null;

        window.GM = {
            async getValue() { return savedConfig; },
            async setValue(_key, value) {
                window.__OMBI_SAVED_CONFIG__ = value;
                document.documentElement.dataset.ombiSavedConfig = value;
            },
            registerMenuCommand() {},
            xmlHttpRequest(options) {
                window.__OMBI_REQUEST_LOG__.push({
                    method: options.method,
                    url: options.url,
                    headers: options.headers,
                    data: options.data
                });
                document.documentElement.dataset.ombiLastRequest = JSON.stringify({
                    method: options.method,
                    url: options.url,
                    data: options.data || null
                });
                let payload;
                if (options.url.endsWith("/api/v1/Status/info")) {
                    payload = "4.53.10";
                } else if (options.url.endsWith("/api/v1/Radarr/Profiles")) {
                    payload = [
                        { id: 1, name: "Any" },
                        { id: 4, name: "1080" },
                        { id: 9, name: "WEB-1080p HEVC" }
                    ];
                } else if (options.method === "POST" && options.url.endsWith("/api/v1/Request/movie")) {
                    payload = { result: true, requestId: 42 };
                } else {
                    payload = { id: 550, title: "Fight Club", requested: false, available: false };
                }
                queueMicrotask(() => options.onload({
                    status: 200,
                    responseText: JSON.stringify(payload)
                }));
            }
        };
    </script>
</head>
<body data-tmdb-id="550">
    <main>
        <div class="film">
            <div class="poster" aria-label="Fight Club poster placeholder"></div>
            <section>
                <h1>Fight Club</h1>
                <p><a href="/films/year/1999/">1999</a> · Directed by David Fincher</p>
                <p>A local fixture used to test the real userscript in Chrome without contacting a live Ombi server.</p>
                <a href="https://www.imdb.com/title/tt0137523/">IMDb</a>
                <a href="https://www.themoviedb.org/movie/550/">TMDb</a>
            </section>
        </div>
    </main>
    <script src="../../dist/ombi-request.user.js"></script>
</body>
</html>
